name: Validate AI Skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agnix:
    name: Agnix Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate agent configs
        uses: agent-sh/agnix@12a1917d13e7c804bc91768c30dd4159f536c5c6

  check-skill:
    name: Links and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check skill
        run: python3 scripts/check_skill.py

  verify-claims:
    name: Claims match official docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current official pages
        run: python3 scripts/fetch_sources.py

      - name: Verify every claim
        run: python3 scripts/verify_claims.py
